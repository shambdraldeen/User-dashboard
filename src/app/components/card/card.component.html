<div  *ngIf="!isLoading">
<div class="mx-auto card-list mt-4">
  <mat-card class="example-card" *ngFor="let user of filteredArray">
    <p>{{ user.id }}</p>
    <img class="avatar" mat-card-image [src]="user.avatar" [alt]="'Photo of ' + user.first_name" />
    <mat-card-content class="mt-2">
      <h5>{{ user.first_name }} {{ user.last_name }}</h5>
    </mat-card-content>
    <mat-card-actions>
      <button mat-button routerLink="/card/{{user.id}}">{{ 'DETAILS' | translate }}</button>
    </mat-card-actions>
  </mat-card>
</div>
<mat-paginator [length]="totalUsers" [pageSize]="pageSize"
(page)="handlePageEvent($event)">
</mat-paginator>
</div>
<div *ngIf="isLoading" class="fa-spinner-container">
  <i class="fas fa-spinner fa-spin fa-2x"></i>
</div>
